name: Release

# On a version tag push: run the full test suite, publish a self-contained
# win-x64 build, package it with Inno Setup, and attach the installer to
# a GitHub Release — docs/AGENTS.md's Packaging/Release Agent: "a Windows
# installer as a GitHub Release asset, produced automatically on tag
# push." Trigger with e.g. `git tag v0.1.0 && git push origin v0.1.0`.

on:
  push:
    tags:
      - 'v*'

jobs:
  build-installer:
    runs-on: windows-latest

    # softprops/action-gh-release needs to create the Release and upload the
    # installer asset — the default GITHUB_TOKEN is read-only otherwise (403
    # "Resource not accessible by integration").
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore ChronTravelers.sln

      - name: Test
        run: dotnet test ChronTravelers.sln -c Release

      - name: Publish self-contained win-x64 build
        run: dotnet publish src/ChronTravelers.Console/ChronTravelers.Console.csproj -c Release -r win-x64 -o publish/win-x64 -p:Version=${{ steps.version.outputs.version }}

      - name: Ensure Inno Setup is available
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.version.outputs.version }} installer\ChronTravelers.iss'

      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/*.exe
          generate_release_notes: true
