name: CI

# Build and run the full test suite on every push/PR to main — the
# "passing CI (dotnet test) required before merge" bar docs/AGENTS.md's
# QA Agent sets. Windows because the whole stack targets Windows
# (docs/TECH_STACK.md) and windows-latest ships everything this repo
# needs out of the box.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ChronoTravelers.sln

      - name: Build
        run: dotnet build ChronoTravelers.sln --no-restore -c Release

      # -m:1 forces MSBuild to run the solution's test projects one at a time
      # instead of its default of one concurrent process per project (Core,
      # Engine, Game, Server.Tests all launching testhosts simultaneously).
      # On windows-latest's constrained core count that concurrency starved
      # ChronoTravelers.Server.Tests's real-socket TelnetConnectionTests,
      # which races a wall-clock timeout against actual TCP round-trips
      # (see that test file's own comments) — it flaked repeatedly in CI
      # (2026-09-05) while always passing run alone or locally. Serializing
      # here removes the CPU contention at its source; TelnetConnectionTests'
      # own timeout was also bumped 30s -> 60s as a second line of defense.
      - name: Test
        run: dotnet test ChronoTravelers.sln --no-build -c Release -m:1 --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
